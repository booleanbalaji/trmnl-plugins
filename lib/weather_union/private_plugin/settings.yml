---
name: Weather Union
strategy: polling
refresh_interval: 30
# Split the lat_lon picker value ("lat,lon") into Weather Union query params.
# Weather Union resolves the nearest station within ~2 km of those coordinates.
polling_url: "{% assign parts = lat_lon | split: ',' %}{% assign lat = parts[0] | strip %}{% assign lon = parts[1] | strip %}https://www.weatherunion.com/gw/weather/external/v0/get_weather_data?latitude={{ lat }}&longitude={{ lon }}"
polling_headers: x-zomato-api-key=##{{ api_key }}
polling_verb: GET
no_screen_padding: 'no'
dark_mode: 'no'
custom_fields:
  - keyname: api_key
    field_type: string
    name: Weather Union API Key
    description: Free key from weatherunion.com profile → Your API access key
    encrypted: true
  - keyname: lat_lon
    field_type: lat_lon
    name: Location
    description: Search your area (or paste lat,lon). Weather Union maps this to the nearest India station within ~2 km.
  - keyname: location_label
    field_type: string
    name: Display name (optional)
    description: Friendly title for the screen. Leave blank to use your searched location coords.
    placeholder: Connaught Place
    optional: true
