- keyname: api_key
  field_type: string
  name: Weather Union API Key
  description: Free key from weatherunion.com profile → Your API access key
  encrypted: true
- keyname: latitude
  field_type: string
  name: Latitude
  description: Example 28.630630 (Connaught Place). Must be within ~2 km of a Weather Union station.
  placeholder: 28.630630
- keyname: longitude
  field_type: string
  name: Longitude
  description: Example 77.220640
  placeholder: 77.220640
- keyname: location_label
  field_type: string
  name: Location label
  description: Shown in the title bar
  placeholder: Connaught Place
  optional: true
